<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="w13l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text class="t-bold" x="390" y="22" text-anchor="middle">Latent diffusion pipeline (Stable-Diffusion style)</text>
<rect class="box-teal" x="20" y="50" width="110" height="46" rx="8"/><text class="t-sm" x="75" y="73" text-anchor="middle" dominant-baseline="middle">text prompt</text>
<rect class="box-teal" x="170" y="50" width="130" height="46" rx="8"/><text class="t-sm" x="235" y="73" text-anchor="middle" dominant-baseline="middle">text encoder (frozen)</text>
<rect class="box-teal" x="340" y="50" width="110" height="46" rx="8"/><text class="t-sm" x="395" y="73" text-anchor="middle" dominant-baseline="middle">tokens: 77×d</text>
<line class="ln" x1="132" y1="73" x2="168" y2="73" marker-end="url(#w13l)"/>
<line class="ln" x1="302" y1="73" x2="338" y2="73" marker-end="url(#w13l)"/>
<rect class="box-red" x="20" y="170" width="120" height="70" rx="8"/><text class="t-sm" x="80" y="198" text-anchor="middle" dominant-baseline="middle">z_T ~ N(0, I)</text><text class="t-sm t-muted" x="80" y="220" text-anchor="middle" dominant-baseline="middle">4×64×64</text>
<rect class="box-purple" x="200" y="150" width="250" height="110" rx="8"/><text class="t-bold" x="325" y="180" text-anchor="middle" dominant-baseline="middle">denoiser (U-Net or DiT)</text><text class="t-sm t-muted" x="325" y="204" text-anchor="middle" dominant-baseline="middle">repeat T' times, in latent space</text><text class="t-sm t-muted" x="325" y="226" text-anchor="middle" dominant-baseline="middle">cross-attention to prompt tokens</text>
<line class="ln" x1="142" y1="205" x2="198" y2="205" marker-end="url(#w13l)"/>
<line class="ln-teal" x1="395" y1="98" x2="395" y2="148" marker-end="url(#w13l)"/>
<path class="ln" d="M325,262 Q325,290 260,290 Q200,290 200,262" fill="none"/>
<rect class="box-green" x="500" y="170" width="110" height="70" rx="8"/><text class="t-sm" x="555" y="198" text-anchor="middle" dominant-baseline="middle">z_0</text><text class="t-sm t-muted" x="555" y="220" text-anchor="middle" dominant-baseline="middle">4×64×64</text>
<line class="ln" x1="452" y1="205" x2="498" y2="205" marker-end="url(#w13l)"/>
<rect class="box-amber" x="650" y="170" width="110" height="70" rx="8"/><text class="t-sm" x="705" y="198" text-anchor="middle" dominant-baseline="middle">VAE decoder</text><text class="t-sm t-muted" x="705" y="220" text-anchor="middle" dominant-baseline="middle">3×512×512</text>
<line class="ln" x1="612" y1="205" x2="648" y2="205" marker-end="url(#w13l)"/>
<text class="t-sm t-muted" x="390" y="318" text-anchor="middle">Training: encode images once with the frozen VAE encoder, then train the denoiser on z_0 = E(x). Downsampling factor 8: 48× fewer values.</text>
</svg>
