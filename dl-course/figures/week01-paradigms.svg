<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="w01p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text class="t-bold" x="20" y="24">Classical machine learning</text>
<g><rect class="box" x="20" y="38" width="100" height="50" rx="6"/><text class="t" x="70" y="63" text-anchor="middle" dominant-baseline="middle">Raw input</text>
<line class="ln" x1="120" y1="63" x2="158" y2="63" marker-end="url(#w01p)"/>
<rect class="box-amber" x="160" y="38" width="190" height="50" rx="6"/><text class="t" x="255" y="55" text-anchor="middle" dominant-baseline="middle">Hand-designed features</text><text class="t-sm t-muted" x="255" y="73" text-anchor="middle" dominant-baseline="middle">SIFT, HOG, n-grams (human effort)</text>
<line class="ln" x1="350" y1="63" x2="388" y2="63" marker-end="url(#w01p)"/>
<rect class="box-blue" x="390" y="38" width="150" height="50" rx="6"/><text class="t" x="465" y="55" text-anchor="middle" dominant-baseline="middle">Simple model</text><text class="t-sm t-muted" x="465" y="73" text-anchor="middle" dominant-baseline="middle">linear / SVM / trees</text>
<line class="ln" x1="540" y1="63" x2="578" y2="63" marker-end="url(#w01p)"/>
<rect class="box" x="580" y="38" width="100" height="50" rx="6"/><text class="t" x="630" y="63" text-anchor="middle" dominant-baseline="middle">Output</text></g>
<text class="t-muted t-sm" x="160" y="112">Only the last box is learned from data.</text>
<line class="ln-dash" x1="20" y1="132" x2="740" y2="132"/>
<text class="t-bold" x="20" y="158">Deep learning (end-to-end representation learning)</text>
<g><rect class="box" x="20" y="172" width="100" height="60" rx="6"/><text class="t" x="70" y="202" text-anchor="middle" dominant-baseline="middle">Raw input</text>
<line class="ln" x1="120" y1="202" x2="148" y2="202" marker-end="url(#w01p)"/>
<rect class="box-green" x="150" y="172" width="90" height="60" rx="6"/><text class="t" x="195" y="195" text-anchor="middle" dominant-baseline="middle">Layer 1</text><text class="t-sm t-muted" x="195" y="214" text-anchor="middle" dominant-baseline="middle">edges</text>
<line class="ln" x1="240" y1="202" x2="268" y2="202" marker-end="url(#w01p)"/>
<rect class="box-green" x="270" y="172" width="90" height="60" rx="6"/><text class="t" x="315" y="195" text-anchor="middle" dominant-baseline="middle">Layer 2</text><text class="t-sm t-muted" x="315" y="214" text-anchor="middle" dominant-baseline="middle">textures</text>
<line class="ln" x1="360" y1="202" x2="388" y2="202" marker-end="url(#w01p)"/>
<rect class="box-green" x="390" y="172" width="90" height="60" rx="6"/><text class="t" x="435" y="195" text-anchor="middle" dominant-baseline="middle">Layer 3</text><text class="t-sm t-muted" x="435" y="214" text-anchor="middle" dominant-baseline="middle">parts</text>
<line class="ln" x1="480" y1="202" x2="508" y2="202" marker-end="url(#w01p)"/>
<rect class="box-green" x="510" y="172" width="90" height="60" rx="6"/><text class="t" x="555" y="195" text-anchor="middle" dominant-baseline="middle">Layer 4</text><text class="t-sm t-muted" x="555" y="214" text-anchor="middle" dominant-baseline="middle">objects</text>
<line class="ln" x1="600" y1="202" x2="628" y2="202" marker-end="url(#w01p)"/>
<rect class="box" x="630" y="172" width="100" height="60" rx="6"/><text class="t" x="680" y="202" text-anchor="middle" dominant-baseline="middle">Output</text></g>
<path class="ln-accent" fill="none" d="M680,236 L680,262 L195,262 L195,238" marker-end="url(#w01p)"/>
<text class="t-accent t-sm" x="20" y="288">Gradients flow back from the loss through every layer, so all stages are learned jointly.</text>
<text class="t-muted t-sm" x="20" y="312">Layer descriptions are the typical picture for image models, not a guarantee for every network.</text>
</svg>
