<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img"><defs><marker id="w06c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text x="380" y="20" class="t t-bold" text-anchor="middle" dominant-baseline="middle">ResNet bottleneck versus MobileNetV2 inverted residual</text><text x="190" y="34" class="t t-bold" text-anchor="middle" dominant-baseline="middle">ResNet bottleneck: wide - narrow - wide</text><rect x="105" y="70" width="170" height="40" rx="5" class="box-purple"/><text x="190.0" y="82.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">256 ch</text><text x="190.0" y="97.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">1x1 conv (reduce to 64)</text><rect x="145" y="130" width="90" height="40" rx="5" class="box-blue"/><text x="190.0" y="142.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">64 ch</text><text x="190.0" y="157.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">3x3 conv</text><rect x="105" y="190" width="170" height="40" rx="5" class="box-purple"/><text x="190.0" y="202.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">256 ch</text><text x="190.0" y="217.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">1x1 conv (expand)</text><line x1="190" y1="110" x2="190" y2="130" class="ln" marker-end="url(#w06c)"/><line x1="190" y1="170" x2="190" y2="190" class="ln" marker-end="url(#w06c)"/><line x1="190" y1="230" x2="190" y2="252" class="ln" marker-end="url(#w06c)"/><circle cx="190" cy="265" r="13" class="box-green"/><text x="190" y="265" class="t t-bold" text-anchor="middle" dominant-baseline="middle">+</text><path d="M190,58 L80,58 L80,265 L176,265" fill="none" class="ln-accent" marker-end="url(#w06c)"/><line x1="190" y1="50" x2="190" y2="69" class="ln" marker-end="url(#w06c)"/><text x="190" y="310" class="t-sm t-accent" text-anchor="middle" dominant-baseline="middle">shortcut joins the WIDE tensors (256)</text><text x="190" y="332" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">block params: 69,632</text><text x="570" y="34" class="t t-bold" text-anchor="middle" dominant-baseline="middle">MobileNetV2: narrow - wide - narrow</text><rect x="480" y="70" width="180" height="40" rx="5" class="box-amber"/><text x="570.0" y="82.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">144 ch</text><text x="570.0" y="97.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">1x1 conv, expand x6, ReLU6</text><rect x="480" y="130" width="180" height="40" rx="5" class="box-blue"/><text x="570.0" y="142.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">144 ch</text><text x="570.0" y="157.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">3x3 depthwise, ReLU6</text><rect x="480" y="190" width="180" height="40" rx="5" class="box-purple"/><text x="570.0" y="202.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">24 ch</text><text x="570.0" y="217.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">1x1 conv, linear (no ReLU)</text><line x1="570" y1="110" x2="570" y2="130" class="ln" marker-end="url(#w06c)"/><line x1="570" y1="170" x2="570" y2="190" class="ln" marker-end="url(#w06c)"/><line x1="570" y1="230" x2="570" y2="252" class="ln" marker-end="url(#w06c)"/><circle cx="570" cy="265" r="13" class="box-green"/><text x="570" y="265" class="t t-bold" text-anchor="middle" dominant-baseline="middle">+</text><path d="M570,58 L455,58 L455,265 L556,265" fill="none" class="ln-accent" marker-end="url(#w06c)"/><line x1="570" y1="50" x2="570" y2="69" class="ln" marker-end="url(#w06c)"/><text x="570" y="50" class="t" text-anchor="middle" dominant-baseline="middle"></text><text x="570" y="310" class="t-sm t-accent" text-anchor="middle" dominant-baseline="middle">shortcut joins the NARROW tensors (24)</text><text x="570" y="332" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">block params: 24x144 + 9x144 + 144x24 = 8,208</text><text x="570" y="354" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">skip only if stride = 1 and C_in = C_out</text>
</svg>
