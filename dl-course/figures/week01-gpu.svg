<text class="t-sm" x="70" y="76" text-anchor="middle" dominant-baseline="middle">big core</text><text class="t-sm" x="160" y="76" text-anchor="middle" dominant-baseline="middle">big core</text><text class="t-sm" x="70" y="132" text-anchor="middle" dominant-baseline="middle">big core</text><text class="t-sm" x="160" y="132" text-anchor="middle" dominant-baseline="middle">big core</text>
<text class="t-sm t-muted" x="115" y="178" text-anchor="middle">few cores, deep caches,</text><text class="t-sm t-muted" x="115" y="194" text-anchor="middle">low latency per task</text>
