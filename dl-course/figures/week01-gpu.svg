<text class="t-sm t-muted" x="435" y="172" text-anchor="middle">thousands of simple lanes (schematic: far fewer drawn),</text><text class="t-sm t-muted" x="435" y="190" text-anchor="middle">built for the same op on lots of data</text>
<!-- memory -->
<rect class="box-amber" x="15" y="245" width="200" height="60" rx="6"/><text class="t" x="115" y="268" text-anchor="middle">System RAM</text><text class="t-sm t-muted" x="115" y="288" text-anchor="middle">hundreds of GB, slower</text>
<rect class="box-amber" x="300" y="245" width="270" height="60" rx="6"/><text class="t" x="435" y="268" text-anchor="middle">GPU memory (HBM / GDDR)</text><text class="t-sm t-muted" x="435" y="288" text-anchor="middle">tens of GB, very high bandwidth</text>
<line class="ln" x1="115" y1="205" x2="115" y2="245"/><line class="ln" x1="435" y1="205" x2="435" y2="245"/>
<line class="ln-red" x1="215" y1="275" x2="300" y2="275" marker-end="url(#w01g)" marker-start="url(#w01g)"/>
<text class="t-sm" x="257" y="262" text-anchor="middle" style="fill:var(--c-red)">PCIe</text>
<text class="t-sm t-muted" x="257" y="296" text-anchor="middle">slow link</text>
<rect class="box" x="598" y="15" width="150" height="290" rx="8"/>
<text class="t-bold t-sm" x="673" y="38" text-anchor="middle">Rules of thumb</text>
<text class="t-sm" x="610" y="64">Keep data on the</text><text class="t-sm" x="610" y="80">device; avoid</text><text class="t-sm" x="610" y="96">.cpu() / .item()</text><text class="t-sm" x="610" y="112">inside loops.</text>
<text class="t-sm" x="610" y="144">Batch work into</text><text class="t-sm" x="610" y="160">large tensor ops.</text>
<text class="t-sm" x="610" y="192">All operands of an</text><text class="t-sm" x="610" y="208">op must be on the</text><text class="t-sm" x="610" y="224">same device.</text>
<text class="t-sm" x="610" y="256">GPU kernels run</text><text class="t-sm" x="610" y="272">asynchronously.</text>
