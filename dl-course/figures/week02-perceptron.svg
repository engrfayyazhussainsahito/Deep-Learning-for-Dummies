<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="w02c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text class="t-bold t-sm" x="20" y="22">The perceptron: a weighted vote followed by a threshold</text>
<circle class="box" cx="50" cy="80" r="18"/><text class="t-mono" x="50" y="80" text-anchor="middle" dominant-baseline="middle">x1</text>
<circle class="box" cx="50" cy="140" r="18"/><text class="t-mono" x="50" y="140" text-anchor="middle" dominant-baseline="middle">x2</text>
<circle class="box" cx="50" cy="200" r="18"/><text class="t-mono" x="50" y="200" text-anchor="middle" dominant-baseline="middle">x3</text>
<circle class="box-green" cx="50" cy="258" r="18"/><text class="t-mono" x="50" y="258" text-anchor="middle" dominant-baseline="middle">1</text>
<circle class="box-blue" cx="230" cy="160" r="34"/><text class="t-mono" x="230" y="160" text-anchor="middle" dominant-baseline="middle">sum</text>
<rect class="box-purple" x="300" y="136" width="70" height="48" rx="8"/>
<path class="ln-bold" fill="none" d="M312,172 L335,172 L335,148 L358,148"/>
<circle class="box-accent" cx="440" cy="160" r="20"/><text class="t-mono" x="440" y="160" text-anchor="middle" dominant-baseline="middle">y</text>
<g class="ln" fill="none">
<line x1="68" y1="84" x2="198" y2="148" marker-end="url(#w02c)"/><line x1="68" y1="140" x2="196" y2="156" marker-end="url(#w02c)"/>
<line x1="68" y1="196" x2="198" y2="172" marker-end="url(#w02c)"/><line x1="68" y1="254" x2="204" y2="180" marker-end="url(#w02c)"/>
<line x1="264" y1="160" x2="298" y2="160" marker-end="url(#w02c)"/><line x1="370" y1="160" x2="418" y2="160" marker-end="url(#w02c)"/></g>
<g class="t-sm t-muted"><text x="115" y="94">w1</text><text x="118" y="136">w2</text><text x="118" y="190">w3</text><text x="125" y="236">b</text></g>
<text class="t-sm" x="335" y="212" text-anchor="middle">step</text>
<text class="t-sm t-mono" x="230" y="222" text-anchor="middle">w.x + b</text>
<text class="t-sm t-muted" x="440" y="206" text-anchor="middle">0 or 1</text>
<!-- boundary panels -->
<rect class="box" x="510" y="40" width="110" height="110" rx="4"/>
<line class="ln-accent" x1="520" y1="140" x2="610" y2="50"/>
<circle class="fill-blue" cx="540" cy="70" r="5"/><circle class="fill-blue" cx="565" cy="85" r="5"/><circle class="fill-blue" cx="550" cy="100" r="5"/>
<circle class="fill-red" cx="590" cy="120" r="5"/><circle class="fill-red" cx="570" cy="132" r="5"/><circle class="fill-red" cx="600" cy="105" r="5"/>
<text class="t-sm" x="565" y="170" text-anchor="middle">AND-like: separable</text>
<rect class="box" x="640" y="40" width="110" height="110" rx="4"/>
<circle class="fill-blue" cx="660" cy="60" r="6"/><circle class="fill-blue" cx="730" cy="130" r="6"/>
<circle class="fill-red" cx="730" cy="60" r="6"/><circle class="fill-red" cx="660" cy="130" r="6"/>
<text class="t-sm" x="695" y="170" text-anchor="middle">XOR: no line works</text>
<text class="t-sm t-muted" x="630" y="220" text-anchor="middle">One neuron draws one hyperplane w.x + b = 0.</text>
<text class="t-sm t-muted" x="630" y="242" text-anchor="middle">Stacking neurons (hidden layer) fixes XOR.</text>
</svg>
