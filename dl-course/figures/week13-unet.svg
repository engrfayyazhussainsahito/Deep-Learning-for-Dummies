<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="w13u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text class="t-bold" x="380" y="22" text-anchor="middle">Diffusion U-Net: predicts ε from (x_t, t, c)</text>
<text class="t-sm t-muted" x="95" y="62" text-anchor="middle">x_t: 3×64×64</text>
<rect class="box-blue" x="40" y="76" width="110" height="46" rx="6"/><text class="t-sm" x="95" y="99" text-anchor="middle" dominant-baseline="middle">ResBlock ×2, 64 ch</text>
<rect class="box-blue" x="130" y="146" width="110" height="46" rx="6"/><text class="t-sm" x="185" y="169" text-anchor="middle" dominant-baseline="middle">ResBlock, 128 ch</text>
<rect class="box-purple" x="220" y="216" width="110" height="46" rx="6"/><text class="t-sm" x="275" y="239" text-anchor="middle" dominant-baseline="middle">Res + Attn, 256 ch</text>
<rect class="box-amber" x="305" y="286" width="150" height="46" rx="6"/><text class="t-sm" x="380" y="309" text-anchor="middle" dominant-baseline="middle">Res + Attn + Res, 256</text>
<rect class="box-purple" x="430" y="216" width="110" height="46" rx="6"/><text class="t-sm" x="485" y="239" text-anchor="middle" dominant-baseline="middle">Res + Attn, 256 ch</text>
<rect class="box-blue" x="520" y="146" width="110" height="46" rx="6"/><text class="t-sm" x="575" y="169" text-anchor="middle" dominant-baseline="middle">ResBlock, 128 ch</text>
<rect class="box-blue" x="610" y="76" width="110" height="46" rx="6"/><text class="t-sm" x="665" y="99" text-anchor="middle" dominant-baseline="middle">ResBlock ×2, 64 ch</text>
<text class="t-sm t-muted" x="665" y="62" text-anchor="middle">ε̂: 3×64×64</text>
<line class="ln" x1="150" y1="115" x2="170" y2="144" marker-end="url(#w13u)"/>
<line class="ln" x1="240" y1="185" x2="260" y2="214" marker-end="url(#w13u)"/>
<line class="ln" x1="320" y1="255" x2="350" y2="284" marker-end="url(#w13u)"/>
<line class="ln" x1="410" y1="284" x2="440" y2="264" marker-end="url(#w13u)"/>
<line class="ln" x1="500" y1="214" x2="530" y2="194" marker-end="url(#w13u)"/>
<line class="ln" x1="590" y1="144" x2="620" y2="124" marker-end="url(#w13u)"/>
<path class="ln-dash ln-accent" d="M150,99 L610,99" fill="none"/>
<path class="ln-dash ln-accent" d="M240,169 L520,169" fill="none"/>
<path class="ln-dash ln-accent" d="M330,239 L430,239" fill="none"/>
<text class="t-sm t-accent" x="380" y="92" text-anchor="middle">skip connection: concatenate encoder features</text>
<text class="t-sm t-muted" x="135" y="230" text-anchor="middle">downsample ↓ 2×</text>
<text class="t-sm t-muted" x="640" y="230" text-anchor="middle">upsample ↑ 2×</text>
<rect class="box-green" x="40" y="340" width="300" height="30" rx="6"/><text class="t-sm" x="190" y="355" text-anchor="middle" dominant-baseline="middle">t → sinusoidal → MLP → added in every ResBlock</text>
<rect class="box-teal" x="420" y="340" width="300" height="30" rx="6"/><text class="t-sm" x="570" y="355" text-anchor="middle" dominant-baseline="middle">text tokens c → keys/values of cross-attention</text>
</svg>
