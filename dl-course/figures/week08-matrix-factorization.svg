<text x="115" y="306" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">most entries unobserved</text>
<text x="235" y="180" class="t-lg" text-anchor="middle" dominant-baseline="middle">~</text>
<rect x="260" y="70" width="80" height="220" rx="6" class="box-blue"/>
<text x="300" y="50" class="t-sm t-bold" text-anchor="middle" dominant-baseline="middle">U (users x d)</text>
<text x="300" y="106" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">p_u1</text>
<text x="300" y="142" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">p_u2</text>
<text x="300" y="178" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">p_u3</text>
<text x="300" y="214" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">p_u4</text>
<text x="300" y="250" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">p_u5</text>
<text x="360" y="180" class="t-lg" text-anchor="middle" dominant-baseline="middle">x</text>
<rect x="385" y="100" width="220" height="60" rx="6" class="box-green"/>
<text x="495" y="86" class="t-sm t-bold" text-anchor="middle" dominant-baseline="middle">V^T (d x items)</text>
<text x="407" y="130" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">q_1</text>
<text x="447" y="130" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">q_2</text>
<text x="487" y="130" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">q_3</text>
<text x="527" y="130" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">q_4</text>
<text x="567" y="130" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">q_5</text>
<text x="495" y="215" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">predicted rating  r_hat(u,i) = p_u . q_i + b_u + b_i</text>
<text x="495" y="240" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">train on observed entries only</text>
<text x="495" y="262" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">loss = sum (r_ui - r_hat)^2 + lambda(|p|^2 + |q|^2)</text>
<text x="380" y="350" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">Rows of U and V are the entity embeddings. word2vec also factorizes a matrix.</text>

</svg>
