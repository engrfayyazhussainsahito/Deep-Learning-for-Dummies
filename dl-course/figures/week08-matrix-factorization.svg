<rect x="168" y="126" width="26" height="30" rx="3" class="box-amber"/>
<text x="181" y="141" class="t-sm" text-anchor="middle" dominant-baseline="middle">4</text>
<rect x="48" y="162" width="26" height="30" rx="3" class="box-amber"/>
<text x="61" y="177" class="t-sm" text-anchor="middle" dominant-baseline="middle">2</text>
<rect x="78" y="162" width="26" height="30" rx="3" class="fill-soft"/>
<rect x="108" y="162" width="26" height="30" rx="3" class="box-amber"/>
