d="M30,62 L160,62" fill="none" class="ln-accent"/><text x="36" y="232" class="t-sm t-accent" text-anchor="start" dominant-baseline="middle">identity</text><text x="190" y="290" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">input 256 ch, output 256 ch; the paths are summed</text><text x="190" y="312" class="t-sm" text-anchor="middle" dominant-baseline="middle">= one grouped 3x3 conv (groups = 32) between 1x1s</text><text x="190" y="334" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">cardinality C = 32 is a new knob next to depth and width</text><text x="190" y="360" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">grouped 3x3 params: 9 x 128 x 128 / 32 = 4,608</text><text x="570" y="34" class="t t-bold" text-anchor="middle" dominant-baseline="middle">DenseNet block (growth rate k)</text><rect x="423" y="80" width="54" height="34" rx="5" class="box-blue"/><text x="450.0" y="97.0" class="t" text-anchor="middle" dominant-baseline="middle">x0</text><rect x="493" y="80" width="54" height="34" rx="5" class="box-teal"/><text x="520.0" y="97.0" class="t" text-anchor="middle" dominant-baseline="middle">H1</text><rect x="563" y="80" width="54" height="34" rx="5" class="box-teal"/><text x="590.0" y="97.0" class="t" text-anchor="middle" dominant-baseline="middle">H2</text><rect x="633" y="80" width="54" height="34" rx="5" class="box-teal"/><text x="660.0" y="97.0" class="t" text-anchor="middle" dominant-baseline="middle">H3</text><line x1="477" y1="97" x2="493" y2="97" class="ln" marker-end="url(#w06b)"/><line x1="547" y1="97" x2="563" y2="97" class="ln" marker-end="url(#w06b)"/><line x1="617" y1="97" x2="633" y2="97" class="ln" marker-end="url(#w06b)"/><path d="M450,114 L450,145 L590,145 L590,116" fill="none" class="ln-accent" marker-end="url(#w06b)"/><path d="M520,114 L520,145 L660,145 L660,116" fill="none" class="ln-accent" marker-end="url(#w06b)"/><path d="M450,114 L450,175 L660,175 L660,116" fill="none" class="ln-accent" marker-end="url(#w06b)"/><text x="570" y="210" class="t-sm t-mono" text-anchor="middle" dominant-baseline="middle">input of H_l = concat(x0, H1, ..., H_(l-1))</text><text x="570" y="238" class="t-sm" text-anchor="middle" dominant-baseline="middle">layer l receives k0 + k(l-1) channels</text><text x="570" y="258" class="t-sm" text-anchor="middle" dominant-baseline="middle">L layers: L(L+1)/2 direct connections</text><text x="570" y="292" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">features are concatenated, never added;</text><text x="570" y="310" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">each layer adds only k new feature maps</text><text x="570" y="338" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">between blocks: 1x1 conv + 2x2 avg-pool</text>
</svg>
