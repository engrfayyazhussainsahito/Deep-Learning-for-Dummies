<text x="380" y="20" class="t t-bold" text-anchor="middle" dominant-baseline="middle">ResNeXt: parallel grouped paths, and DenseNet: concatenated reuse</text><text x="190" y="34" class="t t-bold" text-anchor="middle" dominant-baseline="middle">ResNeXt block (32 paths of width 4)</text><text x="212" y="150" class="t t-lg" text-anchor="middle" dominant-baseline="middle">...</text><rect x="38" y="80" width="44" height="26" rx="5" class="box-purple"/><text x="60.0" y="93.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">1x1,4</text><rect x="38" y="122" width="44" height="26" rx="5" class="box-blue"/><text x="60.0" y="135.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">3x3,4</text><rect x="38" y="164" width="44" height="26" rx="5" class="box-purple"/><text x="60.0" y="177.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">1x1,256</text><line x1="60" y1="106" x2="60" y2="121" class="ln-thin" marker-end="url(#w06b)"/><line x1="60" y1="148" x2="60" y2="163" class="ln-thin" marker-end="url(#w06b)"/><path d="M60,190 L60,215" fill="none" class="ln-thin"/><path d="M60,70 L60,80" fill="none" class="ln-thin"/><rect x="93" y="80" width="44" height="26" rx="5" class="box-purple"/><text x="115.0" y="93.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">1x1,4</text><rect x="93" y="122" width="44" height="26" rx="5" class="box-blue"/><text x="115.0" y="135.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">3x3,4</text><rect x="93" y="164" width="44" height="26" rx="5" class="box-purple"/><text x="115.0" y="177.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">1x1,256</text><line x1="115" y1="106" x2="115" y2="121" class="ln-thin" marker-end="url(#w06b)"/><line x1="115" y1="148" x2="115" y2="163" class="ln-thin" marker-end="url(#w06b)"/><path d="M115,190 L115,215" fill="none" class="ln-thin"/><path d="M115,70 L115,80" fill="none" class="ln-thin"/><rect x="148" y="80" width="44" height="26" rx="5" class="