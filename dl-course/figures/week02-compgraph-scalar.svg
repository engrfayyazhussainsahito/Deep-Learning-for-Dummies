<rect class="box-green" x="20" y="200" width="70" height="38" rx="6"/><text class="t-mono" x="55" y="219" text-anchor="middle" dominant-baseline="middle">b = -0.3</text>
<rect class="box" x="20" y="290" width="70" height="38" rx="6"/><text class="t-mono" x="55" y="309" text-anchor="middle" dominant-baseline="middle">t = 1</text>
<circle class="box-blue" cx="195" cy="104" r="26"/><text class="t-mono" x="195" y="104" text-anchor="middle" dominant-baseline="middle">x*w</text>
<circle class="box-blue" cx="315" cy="170" r="26"/><text class="t-mono" x="315" y="170" text-anchor="middle" dominant-baseline="middle">+</text>
<circle class="box-purple" cx="435" cy="170" r="26"/><text class="t-mono" x="435" y="170" text-anchor="middle" dominant-baseline="middle">sigma</text>
<circle class="box-amber" cx="565" cy="205" r="30"/><text class="t-mono" x="565" y="205" text-anchor="middle" dominant-baseline="middle">(a-t)^2/2</text>
<rect class="box-red" x="672" y="186" width="68" height="38" rx="6"/><text class="t-mono" x="706" y="205" text-anchor="middle" dominant-baseline="middle">L</text>
<g class="ln" fill="none">
<line x1="90" y1="69" x2="172" y2="93" marker-end="url(#w02a)"/><line x1="90" y1="139" x2="172" y2="115" marker-end="url(#w02a)"/>
