<text class="t-bold t-sm" x="20" y="22">One neuron with squared loss: forward values (black) and backward gradients (orange)</text>
<rect class="box" x="20" y="50" width="70" height="38" rx="6"/><text class="t-mono" x="55" y="69" text-anchor="middle" dominant-baseline="middle">x = 1.5</text>
