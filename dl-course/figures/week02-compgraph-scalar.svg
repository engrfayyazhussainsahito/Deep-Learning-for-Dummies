<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="w02a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker>
