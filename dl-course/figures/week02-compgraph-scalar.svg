<g class="t-sm" text-anchor="middle">
<text x="195" y="66">p = 1.2</text><text x="315" y="132">z = 0.9</text><text x="435" y="132">a = 0.7109</text><text x="565" y="166">0.0418</text>
</g>
<g class="t-accent t-sm" text-anchor="middle">
<text x="195" y="148">dL/dp = -0.0594</text><text x="315" y="216">dL/dz = -0.0594</text><text x="435" y="216">dL/da = -0.2891</text><text x="706" y="246">dL/dL = 1</text>
<text x="55" y="42">dL/dx = -0.0475</text><text x="55" y="178">dL/dw = -0.0891</text><text x="55" y="258">dL/db = -0.0594</text>
</g>
