<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="w18a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text class="t-lg t-bold" x="380" y="22" text-anchor="middle">The course in one picture</text>
<rect class="box-blue" x="20" y="40" width="720" height="112" rx="10" style="fill-opacity:.07"/>
<text class="t-sm t-muted" x="32" y="56">Foundations (W1-4)</text>
<rect class="box-blue" x="40" y="68" width="150" height="38" rx="6"/><text class="t" x="115" y="87" text-anchor="middle" dominant-baseline="middle">Tensors + MLE</text>
<rect class="box-blue" x="210" y="68" width="150" height="38" rx="6"/><text class="t" x="285" y="87" text-anchor="middle" dominant-baseline="middle">MLP + backprop</text>
<rect class="box-blue" x="380" y="68" width="150" height="38" rx="6"/><text class="t" x="455" y="87" text-anchor="middle" dominant-baseline="middle">SGD / Adam / norm</text>
<rect class="box-blue" x="550" y="68" width="170" height="38" rx="6"/><text class="t" x="635" y="87" text-anchor="middle" dominant-baseline="middle">Regularization + eval</text>
<line class="ln" x1="190" y1="87" x2="208" y2="87" marker-end="url(#w18a)"/><line class="ln" x1="360" y1="87" x2="378" y2="87" marker-end="url(#w18a)"/><line class="ln" x1="530" y1="87" x2="548" y2="87" marker-end="url(#w18a)"/>
<text class="t-sm" x="380" y="132" text-anchor="middle">Everything below is a loss + a parameterized function + an optimizer + a data pipeline</text>
<rect class="box-green" x="20" y="170" width="350" height="112" rx="10" style="fill-opacity:.07"/>
<text class="t-sm t-muted" x="32" y="186">Inductive biases (W5-8)</text>
<rect class="box-green" x="40" y="198" width="100" height="38" rx="6"/><text class="t" x="90" y="217" text-anchor="middle" dominant-baseline="middle">CNN / ResNet</text>
<rect class="box-green" x="150" y="198" width="100" height="38" rx="6"/><text class="t" x="200" y="217" text-anchor="middle" dominant-baseline="middle">RNN / LSTM</text>
<rect class="box-green" x="260" y="198" width="95" height="38" rx="6"/><text class="t" x="307" y="217" text-anchor="middle" dominant-baseline="middle">Embeddings</text>
<text class="t-sm" x="195" y="262" text-anchor="middle">locality, weight sharing, recurrence, metric geometry</text>
<rect class="box-purple" x="390" y="170" width="350" height="112" rx="10" style="fill-opacity:.07"/>
<text class="t-sm t-muted" x="402" y="186">Attention and pretraining (W9-11)</text>
<rect class="box-purple" x="410" y="198" width="100" height="38" rx="6"/><text class="t" x="460" y="217" text-anchor="middle" dominant-baseline="middle">Transformer</text>
<rect class="box-purple" x="520" y="198" width="100" height="38" rx="6"/><text class="t" x="570" y="217" text-anchor="middle" dominant-baseline="middle">LLMs, RLHF</text>
<rect class="box-purple" x="630" y="198" width="95" height="38" rx="6"/><text class="t" x="677" y="217" text-anchor="middle" dominant-baseline="middle">ViT, CLIP</text>
<text class="t-sm" x="565" y="262" text-anchor="middle">scale, self-supervision, one architecture many modalities</text>
<line class="ln" x1="355" y1="217" x2="408" y2="217" marker-end="url(#w18a)"/>
<rect class="box-amber" x="20" y="300" width="350" height="112" rx="10" style="fill-opacity:.07"/>
<text class="t-sm t-muted" x="32" y="316">Generative and structured (W12-14)</text>
<rect class="box-amber" x="40" y="328" width="100" height="38" rx="6"/><text class="t" x="90" y="347" text-anchor="middle" dominant-baseline="middle">VAE / GAN</text>
<rect class="box-amber" x="150" y="328" width="100" height="38" rx="6"/><text class="t" x="200" y="347" text-anchor="middle" dominant-baseline="middle">Diffusion</text>
<rect class="box-amber" x="260" y="328" width="95" height="38" rx="6"/><text class="t" x="307" y="347" text-anchor="middle" dominant-baseline="middle">GNN</text>
<text class="t-sm" x="195" y="392" text-anchor="middle">densities, ELBO, score, symmetry on graphs</text>
<rect class="box-red" x="390" y="300" width="350" height="112" rx="10" style="fill-opacity:.07"/>
<text class="t-sm t-muted" x="402" y="316">Systems and trust (W15-17)</text>
<rect class="box-red" x="410" y="328" width="100" height="38" rx="6"/><text class="t" x="460" y="347" text-anchor="middle" dominant-baseline="middle">Deep RL</text>
<rect class="box-red" x="520" y="328" width="100" height="38" rx="6"/><text class="t" x="570" y="347" text-anchor="middle" dominant-baseline="middle">Efficiency</text>
<rect class="box-red" x="630" y="328" width="95" height="38" rx="6"/><text class="t" x="677" y="347" text-anchor="middle" dominant-baseline="middle">Trust, theory</text>
<text class="t-sm" x="565" y="392" text-anchor="middle">policy gradient, roofline, calibration, robustness</text>
<line class="ln" x1="380" y1="152" x2="195" y2="168" marker-end="url(#w18a)"/><line class="ln" x1="380" y1="152" x2="565" y2="168" marker-end="url(#w18a)"/>
<line class="ln" x1="195" y1="282" x2="195" y2="298" marker-end="url(#w18a)"/><line class="ln" x1="565" y1="282" x2="565" y2="298" marker-end="url(#w18a)"/>
<line class="ln-dash" x1="410" y1="235" x2="355" y2="330" marker-end="url(#w18a)"/>
<rect class="box-accent" x="20" y="430" width="720" height="70" rx="10"/>
<text class="t-bold" x="380" y="452" text-anchor="middle">Week 18: the scientific method on top of all of it</text>
<text class="t-sm" x="380" y="476" text-anchor="middle">baselines, ablations, seeds and error bars, failure cases, reproducibility, honest claims</text>
<line class="ln" x1="380" y1="412" x2="380" y2="428" marker-end="url(#w18a)"/>
</svg>
