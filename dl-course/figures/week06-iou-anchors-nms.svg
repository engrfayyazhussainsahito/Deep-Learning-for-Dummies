<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img"><defs><marker id="w06e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text x="380" y="18" class="t t-bold" text-anchor="middle" dominant-baseline="middle">IoU, anchors and non-maximum suppression</text><text x="130" y="42" class="t t-bold" text-anchor="middle" dominant-baseline="middle">Intersection over union</text><rect x="40" y="70" width="110" height="80" class="box-blue" fill-opacity="0.5"/><rect x="100" y="100" width="110" height="80" class="box-amber" fill-opacity="0.5"/><rect x="100" y="100" width="50" height="50" class="box-green"/><text x="125" y="125" class="t t-bold" text-anchor="middle" dominant-baseline="middle">I</text><text x="70" y="85" class="t t-bold" text-anchor="middle" dominant-baseline="middle">A</text><text x="185" y="168" class="t t-bold" text-anchor="middle" dominant-baseline="middle">B</text><text x="130" y="205" class="t t-mono" text-anchor="middle" dominant-baseline="middle">IoU = |A &#8745; B| / |A &#8746; B|</text><text x="130" y="226" class="t t-mono" text-anchor="middle" dominant-baseline="middle">= I / (|A| + |B| - I)</text><text x="130" y="248" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">here I=2500, |A|=8800, |B|=8800</text><text x="130" y="266" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">IoU = 2500/15100 = 0.17</text><text x="380" y="42" class="t t-bold" text-anchor="middle" dominant-baseline="middle">Anchors at one grid cell (3 scales x 3 ratios)</text><circle cx="380" cy="150" r="3" class="fill-ink"/><rect x="360.0" y="130.0" width="40" height="40" class="ln-blue"/><rect x="350.0" y="135.0" width="60" height="30" class="ln-blue"/><rect x="365.0" y="120.0" width="30" height="60" class="ln-blue"/><rect x="340.0" y="110.0" width="80" height="80" class="ln-green"/><rect x="325.0" y="122.0" width="110" height="56" class="ln-green"/><rect x="352.0" y="95.0" width="56" height="110" class="ln-green"/><rect x="320.0" y="90.0" width="120" height="120" class="ln-purple"/><rect x="300.0" y="109.0" width="160" height="82" class="ln-purple"/><rect x="339.0" y="70.0" width="82" height="160" class="ln-purple"/><text x="380" y="245" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">every cell of every feature map owns such a set</text><text x="380" y="263" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">label: positive if IoU &#8805; 0.7 (RPN), negative if &lt; 0.3</text><text x="640" y="42" class="t t-bold" text-anchor="middle" dominant-baseline="middle">NMS</text><rect x="560" y="60" width="90" height="70" rx="3" class="box-red" fill-opacity="0.35"/><rect x="572" y="78" width="90" height="70" rx="3" class="box-amber" fill-opacity="0.35"/><rect x="556" y="84" width="90" height="70" rx="3" class="box-amber" fill-opacity="0.35"/><rect x="640" y="150" width="80" height="60" rx="3" class="box-green" fill-opacity="0.35"/><text x="630" y="228" class="t-sm" text-anchor="middle" dominant-baseline="middle">keep 0.92; drop IoU > 0.5</text><text x="630" y="246" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">0.88 survives (other object)</text><text x="640" y="266" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">greedy, per class</text><path d="M20,285 L740,285" fill="none" class="ln-thin"/><text x="380" y="310" class="t-sm" text-anchor="middle" dominant-baseline="middle">Matching rule: predicted box counts as a true positive if IoU with an unmatched ground-truth box (same class) is above a threshold,</text><text x="380" y="330" class="t-sm" text-anchor="middle" dominant-baseline="middle">typically 0.5 (PASCAL VOC) or 0.5, 0.55, ..., 0.95 averaged (COCO).</text>
</svg>
