<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300"><defs><marker id="a10h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text x="390" y="16" class="t-bold" text-anchor="middle" dominant-baseline="middle">The three-pass approach to reading a paper</text>
<rect x="20" y="50" width="235" height="40" rx="6" class="box-blue"/>
<text x="137.5" y="70.0" class="t-bold" text-anchor="middle" dominant-baseline="middle">Pass 1: survey (5-10 min)</text>
<rect x="20" y="100" width="235" height="100" rx="6" class="box"/>
<text x="137.5" y="135.0" class="t" text-anchor="middle" dominant-baseline="middle">title, abstract, intro</text>
<text x="137.5" y="150.0" class="t" text-anchor="middle" dominant-baseline="middle">headings, figures, conclusion</text>
<text x="137.5" y="165.0" class="t" text-anchor="middle" dominant-baseline="middle">Decide: worth a second pass?</text>
<line x1="255" y1="70" x2="275" y2="70" class="ln" marker-end="url(#a10h)"/>
<rect x="275" y="50" width="235" height="40" rx="6" class="box-green"/>
<text x="392.5" y="70.0" class="t-bold" text-anchor="middle" dominant-baseline="middle">Pass 2: grasp (1 hour)</text>
<rect x="275" y="100" width="235" height="100" rx="6" class="box"/>
<text x="392.5" y="135.0" class="t" text-anchor="middle" dominant-baseline="middle">read carefully, skip proofs</text>
<text x="392.5" y="150.0" class="t" text-anchor="middle" dominant-baseline="middle">study figures, tables, ablations</text>
<text x="392.5" y="165.0" class="t" text-anchor="middle" dominant-baseline="middle">Summarize in your own words</text>
<line x1="510" y1="70" x2="530" y2="70" class="ln" marker-end="url(#a10h)"/>
<rect x="530" y="50" width="235" height="40" rx="6" class="box-purple"/>
<text x="647.5" y="70.0" class="t-bold" text-anchor="middle" dominant-baseline="middle">Pass 3: reproduce (hours)</text>
<rect x="530" y="100" width="235" height="100" rx="6" class="box"/>
<text x="647.5" y="135.0" class="t" text-anchor="middle" dominant-baseline="middle">re-derive, re-implement</text>
<text x="647.5" y="150.0" class="t" text-anchor="middle" dominant-baseline="middle">question every assumption</text>
<text x="647.5" y="165.0" class="t" text-anchor="middle" dominant-baseline="middle">Find the unstated limitations</text>
<rect x="20" y="225" width="735" height="50" rx="6" class="box"/>
<text x="387.5" y="250.0" class="t" text-anchor="middle" dominant-baseline="middle">Goal of the presentation: what problem, why prior work fails, the key idea, the evidence, what you do not believe.</text>
</svg>
