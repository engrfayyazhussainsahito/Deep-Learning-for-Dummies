<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="w01l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<!-- supervised -->
<rect class="box-blue" x="15" y="15" width="225" height="270" rx="8"/>
<text class="t-bold" x="127" y="38" text-anchor="middle">Supervised</text>
<rect class="box" x="35" y="60" width="80" height="44" rx="5"/><text class="t" x="75" y="82" text-anchor="middle" dominant-baseline="middle">x (image)</text>
<rect class="box" x="145" y="60" width="80" height="44" rx="5"/><text class="t" x="185" y="82" text-anchor="middle" dominant-baseline="middle">y = "cat"</text>
<text class="t-sm t-muted" x="127" y="82" text-anchor="middle" dominant-baseline="middle">+</text>
<line class="ln" x1="127" y1="112" x2="127" y2="140" marker-end="url(#w01l)"/>
<text class="t" x="127" y="162" text-anchor="middle">learn f(x) ≈ y</text>
<text class="t-sm t-muted" x="127" y="196" text-anchor="middle">labels come from humans</text>
<text class="t-sm t-muted" x="127" y="214" text-anchor="middle">or measurements</text>
<text class="t-sm" x="127" y="248" text-anchor="middle">classification, regression,</text><text class="t-sm" x="127" y="264" text-anchor="middle">translation (pairs)</text>
<!-- unsupervised -->
<rect class="box-green" x="268" y="15" width="225" height="270" rx="8"/>
<text class="t-bold" x="380" y="38" text-anchor="middle">Unsupervised</text>
<rect class="box" x="328" y="60" width="105" height="44" rx="5"/><text class="t" x="380" y="82" text-anchor="middle" dominant-baseline="middle">x only</text>
<line class="ln" x1="380" y1="112" x2="380" y2="140" marker-end="url(#w01l)"/>
<text class="t" x="380" y="162" text-anchor="middle">model structure of p(x)</text>
<text class="t-sm t-muted" x="380" y="196" text-anchor="middle">no target is given;</text>
<text class="t-sm t-muted" x="380" y="214" text-anchor="middle">the data itself is the signal</text>
<text class="t-sm" x="380" y="248" text-anchor="middle">clustering, density estimation,</text><text class="t-sm" x="380" y="264" text-anchor="middle">PCA, generative models</text>
<!-- self-supervised -->
<rect class="box-accent" x="521" y="15" width="225" height="270" rx="8"/>
<text class="t-bold" x="633" y="38" text-anchor="middle">Self-supervised</text>
<rect class="box" x="541" y="60" width="85" height="44" rx="5"/><text class="t-sm" x="583" y="82" text-anchor="middle" dominant-baseline="middle">the cat sat [ ]</text>
<rect class="box" x="650" y="60" width="80" height="44" rx="5"/><text class="t-sm" x="690" y="82" text-anchor="middle" dominant-baseline="middle">target: "on"</text>
<text class="t-sm t-muted" x="638" y="82" text-anchor="middle" dominant-baseline="middle">→</text>
<line class="ln" x1="633" y1="112" x2="633" y2="140" marker-end="url(#w01l)"/>
<text class="t" x="633" y="162" text-anchor="middle">predict a part of x from the rest</text>
<text class="t-sm t-muted" x="633" y="196" text-anchor="middle">labels are manufactured</text>
<text class="t-sm t-muted" x="633" y="214" text-anchor="middle">from the data automatically</text>
<text class="t-sm" x="633" y="248" text-anchor="middle">next-token prediction, masked</text><text class="t-sm" x="633" y="264" text-anchor="middle">modeling, contrastive learning</text>
</svg>
