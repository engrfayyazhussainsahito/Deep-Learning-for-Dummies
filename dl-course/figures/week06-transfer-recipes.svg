<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img"><defs><marker id="w06g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text x="380" y="18" class="t t-bold" text-anchor="middle" dominant-baseline="middle">Transfer learning recipes on a pretrained ResNet</text><text x="110" y="44" class="t t-bold" text-anchor="middle" dominant-baseline="middle">A. Linear probe</text><rect x="35" y="62" width="150" height="34" rx="5" class="box"/><text x="110.0" y="79.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">conv1 + layer1  (frozen)</text><text x="205" y="79" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle"></text><rect x="35" y="106" width="150" height="34" rx="5" class="box"/><text x="110.0" y="123.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">layer2  (frozen)</text><text x="205" y="123" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle"></text><rect x="35" y="150" width="150" height="34" rx="5" class="box"/><text x="110.0" y="167.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">layer3  (frozen)</text><text x="205" y="167" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle"></text><rect x="35" y="194" width="150" height="34" rx="5" class="box"/><text x="110.0" y="211.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">layer4  (frozen)</text><text x="205" y="211" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle"></text><rect x="35" y="238" width="150" height="34" rx="5" class="box-green"/><text x="110.0" y="255.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">fc head</text><text x="205" y="255" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle">lr 1e-3</text><text x="110" y="300" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">train only a new head</text><text x="370" y="44" class="t t-bold" text-anchor="middle" dominant-baseline="middle">B. Partial fine-tune</text><rect x="295" y="62" width="150" height="34" rx="5" class="box"/><text x="370.0" y="79.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">conv1 + layer1  (frozen)</text><text x="465" y="79" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle"></text><rect x="295" y="106" width="150" height="34" rx="5" class="box"/><text x="370.0" y="123.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">layer2  (frozen)</text><text x="465" y="123" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle"></text><rect x="295" y="150" width="150" height="34" rx="5" class="box-blue"/><text x="370.0" y="167.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">layer3</text><text x="465" y="167" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle">1e-4</text><rect x="295" y="194" width="150" height="34" rx="5" class="box-blue"/><text x="370.0" y="211.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">layer4</text><text x="465" y="211" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle">1e-4</text><rect x="295" y="238" width="150" height="34" rx="5" class="box-green"/><text x="370.0" y="255.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">fc head</text><text x="465" y="255" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle">1e-3</text><text x="370" y="300" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">unfreeze the top blocks</text><text x="630" y="44" class="t t-bold" text-anchor="middle" dominant-baseline="middle">C. Full, discriminative LRs</text><rect x="555" y="62" width="150" height="34" rx="5" class="box-blue"/><text x="630.0" y="79.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">conv1 + layer1</text><text x="725" y="79" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle">1e-5</text><rect x="555" y="106" width="150" height="34" rx="5" class="box-blue"/><text x="630.0" y="123.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">layer2</text><text x="725" y="123" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle">3e-5</text><rect x="555" y="150" width="150" height="34" rx="5" class="box-blue"/><text x="630.0" y="167.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">layer3</text><text x="725" y="167" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle">1e-4</text><rect x="555" y="194" width="150" height="34" rx="5" class="box-blue"/><text x="630.0" y="211.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">layer4</text><text x="725" y="211" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle">3e-4</text><rect x="555" y="238" width="150" height="34" rx="5" class="box-green"/><text x="630.0" y="255.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">fc head</text><text x="725" y="255" class="t-sm t-mono" text-anchor="start" dominant-baseline="middle">1e-3</text><text x="630" y="300" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">all layers, smaller LR lower down</text><text x="380" y="335" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">grey: frozen (eval-mode BN, no gradients)    blue: pretrained, trainable    green: new, randomly initialised</text><text x="380" y="358" class="t-sm t-accent" text-anchor="middle" dominant-baseline="middle">more data and a larger domain gap push you from A towards C</text>
</svg>
