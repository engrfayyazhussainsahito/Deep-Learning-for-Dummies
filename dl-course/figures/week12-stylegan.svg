<text x="380" y="272" class="t-sm" text-anchor="middle" dominant-baseline="middle">w is mapped by a learned affine A to per-channel scale and bias for every block (style); noise adds stochastic detail.</text>
<text x="380" y="294" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">Style mixing: use w1 for coarse blocks and w2 for fine blocks to combine attributes of two images.</text>
