<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340"><defs><marker id="v9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text x="380" y="16" class="t-bold" text-anchor="middle" dominant-baseline="middle">DETR: CNN features, Transformer, N object queries, one-to-one Hungarian matching</text>
<rect x="14" y="120" width="70" height="70" rx="6" class="box-blue"/>
<text x="49.0" y="155.0" class="t" text-anchor="middle" dominant-baseline="middle">Image</text>
<rect x="110" y="115" width="80" height="80" rx="6" class="box-green"/>
<text x="150.0" y="147.0" class="t" text-anchor="middle" dominant-baseline="middle">CNN</text>
<text x="150.0" y="164.0" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">backbone</text>
<line x1="84" y1="155" x2="110" y2="155" class="ln" marker-end="url(#v9a)"/>
<rect x="220" y="100" width="80" height="110" rx="6" class="box-purple"/>
