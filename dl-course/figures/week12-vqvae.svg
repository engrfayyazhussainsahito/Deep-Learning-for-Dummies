<text x="380" y="288" class="t-sm" text-anchor="middle" dominant-baseline="middle">Loss = recon + || sg[z_e] - e ||^2 + beta || z_e - sg[e] ||^2, with straight-through gradient z_e &lt;- z_q</text>
