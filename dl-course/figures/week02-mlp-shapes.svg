<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="w02d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text class="t-bold t-sm" x="20" y="22">A 784-128-64-10 MLP on a batch of B images: every arrow is one matrix multiply</text>
<rect class="box" x="20" y="60" width="90" height="170" rx="4"/><text class="t" x="65" y="145" text-anchor="middle">X</text><text class="t-sm t-mono" x="65" y="165" text-anchor="middle">(B, 784)</text>
<rect class="box-blue" x="190" y="60" width="64" height="170" rx="4"/><text class="t" x="222" y="140" text-anchor="middle">H1</text><text class="t-sm t-mono" x="222" y="160" text-anchor="middle">(B,128)</text>
<rect class="box-blue" x="334" y="60" width="44" height="170" rx="4"/><text class="t" x="356" y="140" text-anchor="middle">H2</text><text class="t-sm t-mono" x="356" y="160" text-anchor="middle">(B,64)</text>
<rect class="box-purple" x="458" y="60" width="24" height="170" rx="4"/><text class="t" x="470" y="250" text-anchor="middle">Z</text><text class="t-sm t-mono" x="470" y="270" text-anchor="middle">(B,10)</text>
<rect class="box-amber" x="560" y="60" width="24" height="170" rx="4"/><text class="t" x="572" y="250" text-anchor="middle">P</text><text class="t-sm t-mono" x="572" y="270" text-anchor="middle">(B,10)</text>
<rect class="box-red" x="670" y="125" width="70" height="40" rx="6"/><text class="t" x="705" y="145" text-anchor="middle" dominant-baseline="middle">loss</text>
<g class="ln" fill="none"><line x1="110" y1="145" x2="188" y2="145" marker-end="url(#w02d)"/><line x1="254" y1="145" x2="332" y2="145" marker-end="url(#w02d)"/><line x1="378" y1="145" x2="456" y2="145" marker-end="url(#w02d)"/><line x1="482" y1="145" x2="558" y2="145" marker-end="url(#w02d)"/><line x1="584" y1="145" x2="668" y2="145" marker-end="url(#w02d)"/></g>
<g class="t-sm" text-anchor="middle">
<text x="150" y="114">W1 (784,128)</text><text x="150" y="130">+ b1, ReLU</text>
<text x="294" y="114">W2 (128,64)</text><text x="294" y="130">+ b2, ReLU</text>
<text x="418" y="114">W3 (64,10)</text><text x="418" y="130">+ b3</text>
<text x="520" y="114">softmax</text><text x="626" y="114">cross-</text><text x="626" y="130">entropy</text></g>
<text class="t-sm t-muted" x="20" y="310">Parameters: 784*128+128 + 128*64+64 + 64*10+10 = 109,386. Row i of each matrix is one example; in PyTorch nn.Linear stores W transposed as (out, in).</text>
</svg>
