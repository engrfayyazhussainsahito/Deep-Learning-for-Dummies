<text x="300" y="266" class="t-mono" text-anchor="middle" dominant-baseline="middle">z_t (update)</text>
<line x1="300" y1="340" x2="300" y2="316" class="ln" marker-end="url(#w7e)"/>
<line x1="300" y1="278" x2="300" y2="87" class="ln" marker-end="url(#w7e)"/>
<text x="262" y="150" class="t-sm t-mono t-muted" text-anchor="end" dominant-baseline="middle">1 - z_t</text>
<circle cx="435" cy="140" r="15" class="box-red"/>
<text x="435" y="140" class="t-sm" text-anchor="middle" dominant-baseline="middle">x</text>
<line x1="300" y1="140" x2="418" y2="140" class="ln" marker-end="url(#w7e)"/>
<line x1="435" y1="198" x2="435" y2="157" class="ln" marker-end="url(#w7e)"/>
<path d="M450,140 L600,140 L600,87" class="ln" fill="none" marker-end="url(#w7e)"/>
<text x="525" y="126" class="t-sm t-mono t-muted" text-anchor="middle" dominant-baseline="middle">z_t</text>
<text x="380" y="372" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">h_t = (1 - z) * h_{t-1} + z * h~_t,   h~_t = tanh(W[r * h_{t-1}, x_t] + b)</text>
