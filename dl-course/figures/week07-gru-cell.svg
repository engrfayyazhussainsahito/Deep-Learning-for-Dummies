<line x1="180" y1="70" x2="180" y2="198" class="ln" marker-end="url(#w7e)"/>
<rect x="400" y="200" width="70" height="34" rx="6" class="box-purple"/>
<text x="435.0" y="217.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">tanh</text>
<line x1="195" y1="215" x2="398" y2="215" class="ln" marker-end="url(#w7e)"/>
<text x="435" y="186" class="t-mono" text-anchor="middle" dominant-baseline="middle">h~_t (candidate)</text>
