<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img"><defs><marker id="w7e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text x="380" y="18" class="t t-bold" text-anchor="middle" dominant-baseline="middle">GRU cell: one state h; the update gate z interpolates between old state and candidate</text>
<line x1="40" y1="70" x2="720" y2="70" class="ln-bold" marker-end="url(#w7e)"/>
<text x="30" y="50" class="t-mono" text-anchor="start" dominant-baseline="middle">h_{t-1}</text>
<text x="730" y="50" class="t-mono" text-anchor="end" dominant-baseline="middle">h_t</text>
<circle cx="300" cy="70" r="15" class="box-red"/>
