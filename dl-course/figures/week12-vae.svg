<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330"><defs><marker id="u3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text x="380" y="16" class="t-bold" text-anchor="middle" dominant-baseline="middle">VAE forward pass with the reparameterization trick</text>
<rect x="14" y="120" width="60" height="60" rx="6" class="box-blue"/>
<text x="44.0" y="150.0" class="t" text-anchor="middle" dominant-baseline="middle">x</text>
<rect x="104" y="110" width="100" height="80" rx="6" class="box-purple"/>
<text x="154.0" y="142.0" class="t-bold" text-anchor="middle" dominant-baseline="middle">Encoder</text>
<text x="154.0" y="159.0" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">q_phi(z|x)</text>
<line x1="74" y1="150" x2="104" y2="150" class="ln" marker-end="url(#u3a)"/>
<rect x="250" y="80" width="60" height="34" rx="6" class="box-teal"/>
<text x="280.0" y="97.0" class="t" text-anchor="middle" dominant-baseline="middle">mu(x)</text>
<rect x="240" y="186" width="80" height="34" rx="6" class="box-teal"/>
<text x="280.0" y="203.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">log sigma^2</text>
<line x1="204" y1="140" x2="250" y2="100" class="ln" marker-end="url(#u3a)"/>
<line x1="204" y1="160" x2="250" y2="203" class="ln" marker-end="url(#u3a)"/>
<circle cx="380" cy="150" r="22" class="box-amber"/>
<text x="380" y="150" class="t" text-anchor="middle" dominant-baseline="middle">*  +</text>
<line x1="310" y1="100" x2="364" y2="138" class="ln" marker-end="url(#u3a)"/>
<line x1="310" y1="203" x2="364" y2="162" class="ln" marker-end="url(#u3a)"/>
<rect x="340" y="36" width="80" height="30" rx="6" class="box-amber"/>
<text x="380.0" y="51.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">eps ~ N(0,I)</text>
<line x1="380" y1="66" x2="380" y2="128" class="ln-dash" marker-end="url(#u3a)"/>
<rect x="440" y="120" width="60" height="60" rx="6" class="box-red"/>
<text x="470.0" y="150.0" class="t" text-anchor="middle" dominant-baseline="middle">z</text>
<line x1="402" y1="150" x2="440" y2="150" class="ln" marker-end="url(#u3a)"/>
<rect x="530" y="110" width="100" height="80" rx="6" class="box-green"/>
<text x="580.0" y="142.0" class="t-bold" text-anchor="middle" dominant-baseline="middle">Decoder</text>
<text x="580.0" y="159.0" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">p_theta(x|z)</text>
<line x1="500" y1="150" x2="530" y2="150" class="ln" marker-end="url(#u3a)"/>
<rect x="660" y="120" width="60" height="60" rx="6" class="box-blue"/>
<text x="690.0" y="150.0" class="t" text-anchor="middle" dominant-baseline="middle">x_hat</text>
<line x1="630" y1="150" x2="660" y2="150" class="ln" marker-end="url(#u3a)"/>
<text x="380" y="236" class="t-sm" text-anchor="middle" dominant-baseline="middle">z = mu + sigma * eps  (gradient flows through mu and sigma; randomness is isolated in eps)</text>
<text x="380" y="274" class="t-bold" text-anchor="middle" dominant-baseline="middle">Loss = reconstruction  +  KL( q_phi(z|x) || N(0, I) )</text>
<text x="380" y="308" class="t-sm t-muted" text-anchor="middle" dominant-baseline="middle">KL has a closed form for diagonal Gaussians; reconstruction is estimated with one sample of z.</text>
</svg>
