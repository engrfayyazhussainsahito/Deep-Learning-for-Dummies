<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg">
<text class="t-bold" x="360" y="20" text-anchor="middle">GPipe schedule: p = 4 stages, m = 4 micro-batches (F = forward, B = backward)</text>
<g class="t-sm">
<text x="20" y="62">Stage 0</text><text x="20" y="102">Stage 1</text><text x="20" y="142">Stage 2</text><text x="20" y="182">Stage 3</text></g>
<g>
<rect class="box-blue" x="80" y="45" width="36" height="30"/><rect class="box-blue" x="116" y="45" width="36" height="30"/><rect class="box-blue" x="152" y="45" width="36" height="30"/><rect class="box-blue" x="188" y="45" width="36" height="30"/>
<rect class="box-blue" x="116" y="85" width="36" height="30"/><rect class="box-blue" x="152" y="85" width="36" height="30"/><rect class="box-blue" x="188" y="85" width="36" height="30"/><rect class="box-blue" x="224" y="85" width="36" height="30"/>
<rect class="box-blue" x="152" y="125" width="36" height="30"/><rect class="box-blue" x="188" y="125" width="36" height="30"/><rect class="box-blue" x="224" y="125" width="36" height="30"/><rect class="box-blue" x="260" y="125" width="36" height="30"/>
<rect class="box-blue" x="188" y="165" width="36" height="30"/><rect class="box-blue" x="224" y="165" width="36" height="30"/><rect class="box-blue" x="260" y="165" width="36" height="30"/><rect class="box-blue" x="296" y="165" width="36" height="30"/>
<rect class="box-green" x="332" y="165" width="36" height="30"/><rect class="box-green" x="368" y="165" width="36" height="30"/><rect class="box-green" x="404" y="165" width="36" height="30"/><rect class="box-green" x="440" y="165" width="36" height="30"/>
<rect class="box-green" x="368" y="125" width="36" height="30"/><rect class="box-green" x="404" y="125" width="36" height="30"/><rect class="box-green" x="440" y="125" width="36" height="30"/><rect class="box-green" x="476" y="125" width="36" height="30"/>
<rect class="box-green" x="404" y="85" width="36" height="30"/><rect class="box-green" x="440" y="85" width="36" height="30"/><rect class="box-green" x="476" y="85" width="36" height="30"/><rect class="box-green" x="512" y="85" width="36" height="30"/>
<rect class="box-green" x="440" y="45" width="36" height="30"/><rect class="box-green" x="476" y="45" width="36" height="30"/><rect class="box-green" x="512" y="45" width="36" height="30"/><rect class="box-green" x="548" y="45" width="36" height="30"/>
</g>
<rect class="box-red" x="80" y="165" width="108" height="30" style="opacity:.35"/>
<text class="t-sm" x="134" y="180" text-anchor="middle" dominant-baseline="middle">idle</text>
<text class="t-sm" x="540" y="180" text-anchor="middle" dominant-baseline="middle">idle (bubble)</text>
<text class="t-sm t-muted" x="134" y="215" text-anchor="middle">bubble: (p-1) slots at each end</text>
<text class="t" x="600" y="110">blue: forward</text><text class="t" x="600" y="128">green: backward</text>
<text class="t-sm t-muted" x="20" y="240">Time slots per device: m forward + m backward + (p-1) forward-idle + (p-1) backward-idle.</text>
<text class="t" x="20" y="268">Bubble fraction = (p-1) / (m + p - 1) when forward and backward cost the same.</text>
<text class="t" x="20" y="292">Here (4-1)/(4+4-1) = 3/7 = 43%.  With m = 32: 3/35 = 8.6%.</text>
<text class="t-sm t-muted" x="20" y="316">1F1B reorders work so a micro-batch's backward starts earlier, cutting stored activations from m to p micro-batches; the bubble size is unchanged.</text>
</svg>
