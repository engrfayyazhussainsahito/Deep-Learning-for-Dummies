<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="w13g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text class="t-bold" x="380" y="22" text-anchor="middle">Classifier-free guidance at one sampling step</text>
<rect class="box-blue" x="30" y="120" width="100" height="60" rx="8"/><text class="t" x="80" y="150" text-anchor="middle" dominant-baseline="middle">x_t, t</text>
<rect class="box-teal" x="30" y="220" width="100" height="40" rx="8"/><text class="t-sm" x="80" y="240" text-anchor="middle" dominant-baseline="middle">prompt c</text>
<rect class="box-purple" x="200" y="70" width="150" height="60" rx="8"/><text class="t-sm" x="275" y="100" text-anchor="middle" dominant-baseline="middle">network ε_θ(x_t, t, ∅)</text>
<rect class="box-purple" x="200" y="190" width="150" height="60" rx="8"/><text class="t-sm" x="275" y="220" text-anchor="middle" dominant-baseline="middle">network ε_θ(x_t, t, c)</text>
<text class="t-sm t-muted" x="275" y="150" text-anchor="middle">same weights, null prompt vs real prompt</text>
<line class="ln" x1="132" y1="140" x2="198" y2="105" marker-end="url(#w13g)"/>
<line class="ln" x1="132" y1="160" x2="198" y2="210" marker-end="url(#w13g)"/>
<line class="ln" x1="132" y1="240" x2="198" y2="235" marker-end="url(#w13g)"/>
<rect class="box-amber" x="420" y="130" width="190" height="60" rx="8"/><text class="t-sm" x="515" y="150" text-anchor="middle" dominant-baseline="middle">ε̃ = ε_∅ + w (ε_c − ε_∅)</text><text class="t-sm t-muted" x="515" y="172" text-anchor="middle" dominant-baseline="middle">extrapolate along the "prompt direction"</text>
<line class="ln" x1="352" y1="100" x2="418" y2="150" marker-end="url(#w13g)"/>
<line class="ln" x1="352" y1="220" x2="418" y2="175" marker-end="url(#w13g)"/>
<rect class="box-green" x="660" y="140" width="80" height="40" rx="8"/><text class="t-sm" x="700" y="160" text-anchor="middle" dominant-baseline="middle">x_(t-1)</text>
<line class="ln-bold" x1="612" y1="160" x2="658" y2="160" marker-end="url(#w13g)"/>
<text class="t-sm t-muted" x="380" y="292" text-anchor="middle">w = 0: unconditional.  w = 1: plain conditional model.  w &gt; 1: sharper, more prompt-faithful, less diverse.</text>
</svg>
