<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="w15b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text class="t-bold" x="130" y="24" text-anchor="middle">Dynamic programming</text>
<text class="t-bold" x="380" y="24" text-anchor="middle">Monte Carlo</text>
<text class="t-bold" x="630" y="24" text-anchor="middle">TD(0)</text>
<!-- DP -->
<circle class="box-blue" cx="130" cy="55" r="10"/>
<circle class="fill-ink" cx="85" cy="125" r="5"/><circle class="fill-ink" cx="175" cy="125" r="5"/>
<line class="ln" x1="130" y1="65" x2="85" y2="120"/><line class="ln" x1="130" y1="65" x2="175" y2="120"/>
<circle class="box" cx="60" cy="200" r="9"/><circle class="box" cx="105" cy="200" r="9"/><circle class="box" cx="150" cy="200" r="9"/><circle class="box" cx="195" cy="200" r="9"/>
<line class="ln" x1="85" y1="130" x2="62" y2="192"/><line class="ln" x1="85" y1="130" x2="103" y2="192"/><line class="ln" x1="175" y1="130" x2="152" y2="192"/><line class="ln" x1="175" y1="130" x2="193" y2="192"/>
<text class="t-sm" x="130" y="248" text-anchor="middle">all actions, all successors</text>
<text class="t-sm t-muted" x="130" y="268" text-anchor="middle">needs the model p, r</text>
<!-- MC -->
<circle class="box-blue" cx="380" cy="55" r="10"/>
<circle class="fill-ink" cx="380" cy="105" r="5"/><circle class="box" cx="400" cy="150" r="9"/><circle class="fill-ink" cx="360" cy="195" r="5"/><circle class="box" cx="385" cy="240" r="9"/>
<rect class="box-red" x="365" y="268" width="30" height="18" rx="3"/>
<line class="ln-bold" x1="380" y1="65" x2="380" y2="100"/><line class="ln-bold" x1="380" y1="110" x2="398" y2="142"/><line class="ln-bold" x1="398" y1="159" x2="362" y2="190"/><line class="ln-bold" x1="360" y1="200" x2="383" y2="231"/><line class="ln-bold" x1="385" y1="249" x2="380" y2="266"/>
<text class="t-sm" x="380" y="306" text-anchor="middle">one sampled path to the end</text>
<text class="t-sm t-muted" x="380" y="324" text-anchor="middle">target G_t: unbiased, high variance</text>
<!-- TD -->
<circle class="box-blue" cx="630" cy="55" r="10"/>
<circle class="fill-ink" cx="630" cy="115" r="5"/><circle class="box-green" cx="630" cy="175" r="9"/>
<line class="ln-bold" x1="630" y1="65" x2="630" y2="110"/><line class="ln-bold" x1="630" y1="120" x2="630" y2="165"/>
<path class="ln-dash" d="M650,175 L675,175 L675,60 L645,58" fill="none" marker-end="url(#w15b)"/>
<text class="t-sm" x="684" y="125" text-anchor="start">bootstrap</text>
<text class="t-sm" x="684" y="141" text-anchor="start">V(S')</text>
<text class="t-sm" x="630" y="248" text-anchor="middle">one sampled step</text>
<text class="t-sm t-muted" x="630" y="268" text-anchor="middle">target R + γV(S'): biased, low variance</text>
<text class="t-sm t-muted" x="42" y="320" text-anchor="start">open circle = state, filled dot = action; filled bar = terminal</text>
</svg>
