<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400"><defs><marker id="a10d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text x="390" y="16" class="t-bold" text-anchor="middle" dominant-baseline="middle">The InstructGPT-style alignment pipeline</text>
<rect x="20" y="50" width="200" height="60" rx="6" class="box-blue"/>
<text x="120.0" y="72.5" class="t" text-anchor="middle" dominant-baseline="middle">1. Pretrained LM</text>
<text x="120.0" y="87.5" class="t" text-anchor="middle" dominant-baseline="middle">(next-token prediction)</text>
<line x1="120" y1="110" x2="120" y2="150" class="ln" marker-end="url(#a10d)"/>
<rect x="20" y="150" width="200" height="70" rx="6" class="box-green"/>
<text x="120.0" y="170.0" class="t" text-anchor="middle" dominant-baseline="middle">2. SFT</text>
<text x="120.0" y="185.0" class="t" text-anchor="middle" dominant-baseline="middle">demonstrations: (x, y*)</text>
<text x="120.0" y="200.0" class="t" text-anchor="middle" dominant-baseline="middle">cross-entropy</text>
<line x1="220" y1="185" x2="290" y2="185" class="ln" marker-end="url(#a10d)"/>
<rect x="290" y="150" width="200" height="70" rx="6" class="box-purple"/>
<text x="390.0" y="170.0" class="t" text-anchor="middle" dominant-baseline="middle">3. Reward model</text>
<text x="390.0" y="185.0" class="t" text-anchor="middle" dominant-baseline="middle">comparisons: y_w &gt; y_l</text>
<text x="390.0" y="200.0" class="t" text-anchor="middle" dominant-baseline="middle">Bradley-Terry loss</text>
<line x1="490" y1="185" x2="550" y2="185" class="ln" marker-end="url(#a10d)"/>
<rect x="550" y="150" width="210" height="70" rx="6" class="box-amber"/>
<text x="655.0" y="170.0" class="t" text-anchor="middle" dominant-baseline="middle">4. RL (PPO)</text>
<text x="655.0" y="185.0" class="t" text-anchor="middle" dominant-baseline="middle">maximize r(x,y)</text>
<text x="655.0" y="200.0" class="t" text-anchor="middle" dominant-baseline="middle">- beta KL(pi || pi_SFT)</text>
<path d="M120,220 L120,300 L650,300 L650,220" class="ln-dash" fill="none" marker-end="url(#a10d)"/>
<text x="385" y="314" class="t-sm" text-anchor="middle" dominant-baseline="middle">policy initialised from SFT; SFT model also serves as the KL reference</text>
<rect x="290" y="50" width="200" height="60" rx="6" class="box"/>
<text x="390.0" y="72.5" class="t" text-anchor="middle" dominant-baseline="middle">Prompts x</text>
<text x="390.0" y="87.5" class="t" text-anchor="middle" dominant-baseline="middle">sample k responses, humans rank</text>
<line x1="390" y1="110" x2="390" y2="150" class="ln-dash" marker-end="url(#a10d)"/>
<rect x="20" y="340" width="740" height="40" rx="6" class="box"/>
<text x="390.0" y="360.0" class="t" text-anchor="middle" dominant-baseline="middle">DPO skips steps 3 and 4: it optimizes the policy directly on the same comparison data.</text>
</svg>
