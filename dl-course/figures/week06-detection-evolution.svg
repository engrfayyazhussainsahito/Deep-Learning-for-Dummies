<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" role="img"><defs><marker id="w06d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--c-muted)"/></marker></defs>
<text x="380" y="18" class="t t-bold" text-anchor="middle" dominant-baseline="middle">From R-CNN to one-stage detectors: what is shared and what is learned</text><text x="10" y="64" class="t t-bold" text-anchor="start" dominant-baseline="middle">R-CNN</text><rect x="150" y="40" width="80" height="48" rx="5" class="box"/><text x="190.0" y="64.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">image</text><line x1="230" y1="64" x2="244" y2="64" class="ln" marker-end="url(#w06d)"/><rect x="246" y="40" width="110" height="48" rx="5" class="box-amber"/><text x="301.0" y="56.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">~2000 region</text><text x="301.0" y="71.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">proposals</text><line x1="356" y1="64" x2="370" y2="64" class="ln" marker-end="url(#w06d)"/><rect x="372" y="40" width="110" height="48" rx="5" class="box-blue"/><text x="427.0" y="56.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">CNN per crop</text><text x="427.0" y="71.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">(2000x)</text><line x1="482" y1="64" x2="496" y2="64" class="ln" marker-end="url(#w06d)"/><rect x="498" y="40" width="90" height="48" rx="5" class="box-purple"/><text x="543.0" y="56.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">SVM +</text><text x="543.0" y="71.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">box regress</text><text x="150" y="106" class="t-sm t-muted" text-anchor="start" dominant-baseline="middle">2014: expensive, ~2000 forward passes per image; stages trained separately</text><text x="10" y="154" class="t t-bold" text-anchor="start" dominant-baseline="middle">Fast R-CNN</text><rect x="150" y="130" width="80" height="48" rx="5" class="box"/><text x="190.0" y="154.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">image</text><line x1="230" y1="154" x2="244" y2="154" class="ln" marker-end="url(#w06d)"/><rect x="246" y="130" width="110" height="48" rx="5" class="box-blue"/><text x="301.0" y="146.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">CNN once</text><text x="301.0" y="161.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">feature map</text><line x1="356" y1="154" x2="370" y2="154" class="ln" marker-end="url(#w06d)"/><rect x="372" y="130" width="110" height="48" rx="5" class="box-amber"/><text x="427.0" y="146.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">proposals +</text><text x="427.0" y="161.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">RoI pooling</text><line x1="482" y1="154" x2="496" y2="154" class="ln" marker-end="url(#w06d)"/><rect x="498" y="130" width="90" height="48" rx="5" class="box-purple"/><text x="543.0" y="146.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">FC heads:</text><text x="543.0" y="161.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">cls + box</text><text x="150" y="196" class="t-sm t-muted" text-anchor="start" dominant-baseline="middle">2015: share the conv features, one multi-task loss; proposals still external</text><text x="10" y="244" class="t t-bold" text-anchor="start" dominant-baseline="middle">Faster R-CNN</text><rect x="150" y="220" width="80" height="48" rx="5" class="box"/><text x="190.0" y="244.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">image</text><line x1="230" y1="244" x2="244" y2="244" class="ln" marker-end="url(#w06d)"/><rect x="246" y="220" width="110" height="48" rx="5" class="box-blue"/><text x="301.0" y="236.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">backbone</text><text x="301.0" y="251.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">feature map</text><line x1="356" y1="244" x2="370" y2="244" class="ln" marker-end="url(#w06d)"/><rect x="372" y="220" width="110" height="48" rx="5" class="box-green"/><text x="427.0" y="236.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">RPN: anchors</text><text x="427.0" y="251.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">-> proposals</text><line x1="482" y1="244" x2="496" y2="244" class="ln" marker-end="url(#w06d)"/><rect x="498" y="220" width="100" height="48" rx="5" class="box-amber"/><text x="548.0" y="244.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">RoI pool/align</text><line x1="598" y1="244" x2="612" y2="244" class="ln" marker-end="url(#w06d)"/><rect x="614" y="220" width="90" height="48" rx="5" class="box-purple"/><text x="659.0" y="244.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">cls + box</text><text x="150" y="286" class="t-sm t-muted" text-anchor="start" dominant-baseline="middle">2015: proposals come from a learned Region Proposal Network on the same features</text><text x="10" y="334" class="t t-bold" text-anchor="start" dominant-baseline="middle">One-stage</text><rect x="150" y="310" width="80" height="48" rx="5" class="box"/><text x="190.0" y="334.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">image</text><line x1="230" y1="334" x2="244" y2="334" class="ln" marker-end="url(#w06d)"/><rect x="246" y="310" width="110" height="48" rx="5" class="box-blue"/><text x="301.0" y="326.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">backbone</text><text x="301.0" y="341.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">(+ FPN)</text><line x1="356" y1="334" x2="370" y2="334" class="ln" marker-end="url(#w06d)"/><rect x="372" y="310" width="210" height="48" rx="5" class="box-green"/><text x="477.0" y="326.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">dense predictions per anchor:</text><text x="477.0" y="341.5" class="t-sm" text-anchor="middle" dominant-baseline="middle">class scores + box offsets</text><line x1="582" y1="334" x2="596" y2="334" class="ln" marker-end="url(#w06d)"/><rect x="598" y="310" width="90" height="48" rx="5" class="box-red"/><text x="643.0" y="334.0" class="t-sm" text-anchor="middle" dominant-baseline="middle">NMS</text><text x="150" y="376" class="t-sm t-muted" text-anchor="start" dominant-baseline="middle">one stage: no proposal step; every location predicts directly, then NMS removes duplicates</text>
</svg>
