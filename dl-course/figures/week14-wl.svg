<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg">
<text class="t-bold" x="390" y="22" text-anchor="middle">1-WL cannot tell a 6-cycle from two triangles</text>
<g class="ln"><line x1="80" y1="100" x2="140" y2="70"/><line x1="140" y1="70" x2="200" y2="100"/><line x1="200" y1="100" x2="200" y2="160"/><line x1="200" y1="160" x2="140" y2="190"/><line x1="140" y1="190" x2="80" y2="160"/><line x1="80" y1="160" x2="80" y2="100"/></g>
<g class="box-blue"><circle cx="80" cy="100" r="14"/><circle cx="140" cy="70" r="14"/><circle cx="200" cy="100" r="14"/><circle cx="200" cy="160" r="14"/><circle cx="140" cy="190" r="14"/><circle cx="80" cy="160" r="14"/></g>
<text class="t-bold" x="140" y="228" text-anchor="middle">G₁: hexagon C₆</text>
<g class="ln"><line x1="520" y1="100" x2="580" y2="70"/><line x1="580" y1="70" x2="580" y2="130"/><line x1="580" y1="130" x2="520" y2="100"/><line x1="640" y1="130" x2="700" y2="100"/><line x1="700" y1="100" x2="700" y2="160"/><line x1="700" y1="160" x2="640" y2="130"/></g>
<g class="box-blue"><circle cx="520" cy="100" r="14"/><circle cx="580" cy="70" r="14"/><circle cx="580" cy="130" r="14"/><circle cx="640" cy="130" r="14"/><circle cx="700" cy="100" r="14"/><circle cx="700" cy="160" r="14"/></g>
<text class="t-bold" x="610" y="228" text-anchor="middle">G₂: two triangles 2·C₃</text>
<text class="t-sm" x="390" y="100" text-anchor="middle">round 0: all colour 0</text>
<text class="t-sm" x="390" y="124" text-anchor="middle">round 1: every node (color 0, {0,0}) → color 1</text>
<text class="t-sm" x="390" y="148" text-anchor="middle">round k: every node (color 1, {1,1}) → color 1 ...</text>
<text class="t-sm t-accent" x="390" y="176" text-anchor="middle">identical color histograms forever</text>
<text class="t-sm t-muted" x="390" y="280" text-anchor="middle">Both graphs are 2-regular with 6 nodes, so any message-passing GNN (at most 1-WL powerful)</text>
<text class="t-sm t-muted" x="390" y="300" text-anchor="middle">assigns them identical embeddings, although one is connected and one is not, and C₆ has no triangles.</text>
</svg>
